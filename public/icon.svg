<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Ledger Book Icon -->
  <g transform="translate(106, 96)">
    <!-- Book Back -->
    <rect x="20" y="20" width="260" height="300" rx="20" fill="#064e3b" />
    <!-- Book Front Cover -->
    <rect x="35" y="10" width="250" height="300" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- Book Spine -->
    <rect x="35" y="10" width="24" height="300" rx="4" fill="#10b981" />
    <!-- Golden Ribbon Marker -->
    <path d="M190 10 L190 120 L205 105 L220 120 L220 10 Z" fill="url(#goldGrad)" />
    <!-- Shop / Calculator Symbol -->
    <!-- Rupee / Currency Mark (₨ / Khata mark) -->
    <circle cx="160" cy="180" r="50" fill="#1e293b" stroke="#10b981" stroke-width="4" />
    <text x="160" y="196" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#34d399" text-anchor="middle">₨</text>
    
    <!-- Ledger Lines -->
    <line x1="85" y1="70" x2="160" y2="70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="95" x2="140" y2="95" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    
    <line x1="85" y1="265" x2="245" y2="265" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <line x1="85" y1="285" x2="210" y2="285" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
